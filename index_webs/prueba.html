<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>:root {
  --color-primario: #6a1a2f; /* tu guinda del CBTis */
  --color-primario-oscuro: #4d1222;
  --color-texto: #333;
  --color-fondo: #f5f5f5;
  --color-blanco: #fff;
  --radio-borde: 12px;
  --sombra: 0 4px 15px rgba(0,0,0,0.1);
  --espaciado: 20px;
  --fuente: 'Segoe UI', sans-serif;
}

.seccion-contacto {
  padding: 40px var(--espaciado);
  background: var(--color-fondo);
  font-family: var(--fuente);
}

.contenedor-contacto {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  grid-auto-rows: 1fr; /* ESTO arregla la altura */
  gap: var(--espaciado);
  max-width: 1200px;
  margin: auto;
}

.tarjeta-contacto {
  background: var(--color-blanco);
  border-radius: var(--radio-borde);
  padding: var(--espaciado);
  box-shadow: var(--sombra);
  height: 100%;
  border-top: 4px solid var(--color-primario);
}

.tarjeta-contacto h4 {
  color: var(--color-primario);
  margin-bottom: 8px;
}

.contenedor-facebook {
  margin-top: 40px;
  display: flex;
  justify-content: center;
}</style>
</head>
<body>
    <div id="fb-root"></div>
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/es_LA/sdk.js#xfbml=1&version=v19.0"></script>

<section class="seccion-contacto">
  <h2 style="text-align:center; color: var(--color-primario); margin-bottom:30px;">Contacto</h2>
  
  <div class="contenedor-contacto">
    <div class="tarjeta-contacto">
      <h4>Dirección</h4>
      <p>CBTis No. 258 Mariano Escobedo, Av. Las Torres 450, 66050 Cd. Gral. Escobedo, N.L.</p>
    </div>
    <div class="tarjeta-contacto">
      <h4>Teléfono</h4>
      <p>81 1234 5678</p>
    </div>
    <div class="tarjeta-contacto">
      <h4>Correo</h4>
      <p>cbtis258.escobedo@dgeti.sems.gob.mx<br>cbtis258@example.com</p>
    </div>
    <div class="tarjeta-contacto">
      <h4>Horario</h4>
      <p>Lunes a Viernes 7:00 - 15:00</p>
    </div>
  </div>

  <div class="contenedor-facebook">
    <div class="fb-page" 
      data-href="https://www.facebook.com/Cbtis258Escobedo" 
      data-tabs="timeline" 
      data-width="500" 
      data-height="600" 
      data-small-header="false" 
      data-adapt-container-width="true" 
      data-hide-cover="false" 
      data-show-facepile="true">
    </div>
  </div>
</section>
</body>
</html>
